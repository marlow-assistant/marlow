name: ios

# Deliberately a separate workflow from ci.yml, not a second job in it:
# GitHub's path filters are workflow-level, so this is the only way to keep the
# ~25s Python gate untouched on server-only changes while still gating ios/.
# A macOS run takes ~8 min against the gate's seconds, so it only ever fires
# when ios/ (or this file) actually changed.
#
# push, not pull_request: pull_request's path filter matches against the
# PR's *entire* diff (base...head) on every synchronize, so once ios/**
# changed anywhere in a PR's history, every later push re-triggers it even
# if that push only touched docs (confirmed 2026-08-04 on the permission-UI PR — a
# docs-only merge commit still fired the macOS job). push's path filter is
# per-push-diff instead, so it only fires when that specific push actually
# touches ios/**. No `branches:` restriction — this covers feature-branch
# pushes the same way pull_request used to.
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}

# An expensive job is worth cancelling when a branch is pushed again.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-test:
    # This image's *default* toolchain is Xcode 16.4 / iOS 18.5 SDK (confirmed
    # 2026-07-31), while the dev Mac is on Xcode 26. The drift was left alone
    # as a useful floor until it bit: the app uses SpeechTranscriber, which
    # exists only in the iOS 26 SDK, so every run from 2026-10-28 on failed to
    # compile. `@available(iOS 26, *)` guards the runtime, not the SDK. The
    # "Select Xcode 26" step below picks the newest Xcode 26 the image has, by
    # glob rather than an exact path, so an image update that swaps 26.x
    # releases doesn't break the job.
    runs-on: macos-15
    # Observed 2026-10-31 on Xcode 26.3: ~7m40 job, of which ~3 min is the
    # cold build, ~2m40 a stall before the app first launches on the
    # simulator, and ~54s the suite (6.5s locally). 15 leaves room for runner
    # variance, which is large (the package fetch alone ran 40s to 90s).
    # Minutes are free on a public repo, so the cap guards a hung run rather
    # than a bill.
    #
    # Pre-booting the simulator during the build doesn't help (tried
    # 2026-10-31): `bootstatus` then returns in seconds, but the stall isn't
    # the boot. It is a one-off cost the first time xcodebuild uses the
    # device by id, and it moved into the build or stayed before the launch.
    # Building for the generic simulator instead also compiles x86_64,
    # doubling the build. Both runs were slower than this one step.
    #
    # Treat hitting this as a *signal*, not just a cost control. The suite
    # cannot hang: awaitPendingWork(timeout:) and Gate.waitOpened(timeout:)
    # both bail at 10s and fail loudly. So a timeout here means the build,
    # simulator boot, or the runner itself — not a test.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Before the simulator pick: simctl answers for the selected Xcode, so
      # the picker sees the iOS 26 runtimes only once this has run.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            echo "no Xcode 26 on this runner image; installed:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "Xcode: \`$XCODE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install xcodegen
        run: brew install xcodegen

      # Regenerate rather than trusting the committed .xcodeproj: project.yml is
      # the source of truth (see docs/tasks/ios-minimal-client.md), and building
      # the checked-in project would let a stale pbxproj mask a broken
      # project.yml. Deliberately not diffed against the committed project — the
      # runner's xcodegen version won't always byte-match a local one, and a
      # spurious red gate is worse than no gate.
      - name: Generate project
        working-directory: ios/Marlow
        run: xcodegen generate

      # Runner images change their installed simulators without notice, so
      # resolve a device rather than hardcoding a name. The choice is *ordered*,
      # not incidental: newest iOS runtime, then highest iPhone model number.
      # Taking whatever the JSON happened to list last picked an iPhone SE on
      # the first run, and would silently change device the day an image update
      # reorders things — making a device-dependent failure unreproducible and
      # "it passed CI" a claim about an unknown device.
      - name: Pick a simulator
        id: sim
        run: |
          # The assignment stays on its own line on purpose. Folding it into
          # `read -r ... <<<"$(...)"` makes the compound's exit status `read`'s,
          # and a here-string always supplies a trailing newline, so `read`
          # returns 0 even when the substitution produced nothing -- the step
          # goes green with an empty UDID and the failure resurfaces later as a
          # baffling `-destination "id="` error. A bare assignment propagates
          # the substitution's status, so `set -e` still bites here.
          SIM=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys

          def runtime_version(identifier):
              match = re.search(r"iOS-(\d+)(?:-(\d+))?", identifier)
              if not match:
                  return (0, 0)
              return (int(match.group(1)), int(match.group(2) or 0))

          def model_number(name):
              match = re.search(r"iPhone\s+(\d+)", name)
              return int(match.group(1)) if match else -1

          devices = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime_version(runtime), model_number(device["name"]), device)
              for runtime, entries in devices.items() if "iOS" in runtime
              for device in entries
              if device.get("isAvailable") and "iPhone" in device["name"]
          ]
          if not candidates:
              sys.exit("no available iPhone simulator on this runner")
          runtime, model, device = max(candidates, key=lambda c: (c[0], c[1], c[2]["name"]))
          print(device["udid"], device["name"] + " (iOS %d.%d)" % runtime)
          ')
          read -r UDID NAME <<<"$SIM"
          [ -n "$UDID" ] || { echo "simulator picker produced no UDID" >&2; exit 1; }
          # Smoke-test that the chosen device actually exists on this runner,
          # rather than discovering it two steps later inside xcodebuild.
          xcrun simctl list devices | grep -q "$UDID" \
            || { echo "picked UDID $UDID is not present on this runner" >&2; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Testing on: $NAME ($UDID)"
          echo "Testing on **$NAME** (\`$UDID\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        working-directory: ios/Marlow
        run: |
          xcodebuild test \
            -scheme Marlow \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AppIdentifierPrefix="CITEAM0000."
        # AppIdentifierPrefix: an unsigned build has no team, so the setting
        # is empty and NotificationSharedTests' keychain-group test fails. The
        # repo carries no team ID (2026-10-26), so CI supplies an obvious
        # placeholder of the right shape; the test still checks that the Swift
        # string is built from the setting, which is what it guards.
